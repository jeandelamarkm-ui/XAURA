<!DOCTYPE html>
<html lang="es-CO" data-theme="dark">
<head>
  <meta charset="UTF-8">

  <!-- ===== PWA / iOS META (SPEC §10) ===== -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0A0A0B">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="XAURA">
  <meta name="application-name" content="XAURA">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Tu patrimonio, en un solo lugar. Finanzas personales, eventos y trading en una sola app privada y offline.">

  <title>XAURA</title>

  <!-- Iconos / manifest -->
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png">
  <link rel="mask-icon" href="assets/icon.svg" color="#D4AF37">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Fuentes: preconnect para acelerar el @import del fallback de desarrollo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- ===== HOJAS DE ESTILO (orden estricto, SPEC §3) ===== -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
</head>

<body>
  <!-- ===== AURA / SPLASH DE FONDO ===== -->
  <div id="aura-bg" class="aura-bg" aria-hidden="true"></div>

  <!-- ===== SHELL DE LA APP ===== -->
  <div class="app-shell" id="appshell">

    <!-- Cabecera reutilizable (la pinta js/ui/header.js) -->
    <header class="app-header" id="appheader">
      <div class="header-inner">
        <span class="app-brand">X<span class="brand-aura">A</span>URA</span>
      </div>
    </header>

    <!-- Contenedor de vistas (lo controla el router) -->
    <main class="app-main" id="view" role="main"></main>

    <!-- Bottom nav + FAB (lo monta js/ui/nav.js) -->
    <nav class="bottomnav" id="bottomnav" aria-label="Navegación principal"></nav>
  </div>

  <!-- ===== OVERLAYS: sheets, modales y toasts ===== -->
  <div id="overlays" class="overlays-root">
    <div id="sheet-root"></div>
    <div id="modal-root"></div>
    <div class="toast-stack" id="toast-root" aria-live="polite" aria-atomic="false"></div>
  </div>

  <!-- ===== ARRANQUE ===== -->
  <script type="module" src="js/app.js"></script>

  <!-- Sin JS: aviso mínimo -->
  <noscript>
    <div style="padding:24px;text-align:center;color:#F5F5F7;font-family:sans-serif;">
      XAURA necesita JavaScript para funcionar. Actívalo en tu navegador.
    </div>
  </noscript>
</body>
</html>
